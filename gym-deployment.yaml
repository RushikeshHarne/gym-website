apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-app-deployment
  labels:
    app: gym-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gym-app
  template:
    metadata:
      labels:
        app: gym-app
    spec:
      containers:
      - name: gym-app
        image: harnempire/ironforge-gym:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: NEXT_PUBLIC_SUPABASE_URL
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: gym-app-service
spec:
  type: LoadBalancer
  selector:
    app: gym-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      
